# 이 파일을 복사해서 application.properties로 이름을 바꾸고 비밀번호를 채우세요.
# application.properties는 .gitignore에 있어서 깃허브에 올라가지 않습니다.
spring.application.name=backend

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/roboparking?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=여기에_MySQL_비밀번호

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 관제 엔진(FastAPI) 주소
engine.base-url=http://localhost:8000
